[alembic]
script_location = %(here)s/alembic
sqlalchemy.url = sqlite:///./face_organizer.db
timezone = UTC
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_environment = true
target_metadata = None
sourceless = false
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

